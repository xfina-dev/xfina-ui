name: Check PR

on:
  pull_request:
    branches: [ "main" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # One job, so there is a single check to require. Named Web, as the web
  # checks of xfina, xfina-labs and xsteer are, so branch protection across
  # the repositories names few distinct checks.
  web:
    name: Web
    # arm64 is free on public repositories and does the same work for less
    # power. The label pins an image version and has to be bumped when that
    # image is retired.
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Require a changelog entry for shipped changes
        run: |
          BASE=origin/${{ github.base_ref }}
          git fetch -q origin ${{ github.base_ref }}
          # src/ is what sites receive. Tests, docs and the demo page are not.
          if git diff --name-only $BASE...HEAD -- src/ | grep -q .; then
            if ! git diff --name-only $BASE...HEAD | grep -qx CHANGELOG.md; then
              echo "::error::src/ changed but CHANGELOG.md did not. Sites read it to decide whether to upgrade."
              exit 1
            fi
          fi

      - run: npm ci

      # The package as sites install it: components, style.css, preset, plugin.
      - run: npm run build

      - run: npm test

      # The gallery builds against the source, so a component that only
      # breaks inside a real Vite and Tailwind build fails here.
      - run: npm run demo:build
